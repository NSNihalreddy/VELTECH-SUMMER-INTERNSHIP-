<!DOCTYPE html>
<html lang="en">

<head>
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(135deg,#0f172a,#1e40af,#2563eb);

}

.card{

width:420px;

background:rgba(255,255,255,.12);

backdrop-filter:blur(18px);

padding:40px;

border-radius:20px;

color:white;

text-align:center;

box-shadow:0 20px 50px rgba(0,0,0,.35);

}

h2{

margin-bottom:25px;

}

input{

width:100%;

height:50px;

margin-bottom:18px;

border:none;

border-radius:10px;

padding:0 15px;

font-size:16px;

outline:none;

}

button{

width:100%;

height:50px;

border:none;

border-radius:10px;

background:#2563eb;

color:white;

font-size:17px;

cursor:pointer;

}

button:hover{

background:#1d4ed8;

}
.password-box{

position:relative;

margin-bottom:18px;

}

.password-box input{

padding-right:45px;

}

.toggle{

position:absolute;

right:15px;

top:50%;

transform:translateY(-50%);

cursor:pointer;

color:#555;

font-size:18px;

}

#matchText{

font-size:14px;

margin-bottom:18px;

font-weight:600;

}
.password-box{
    position:relative;
    margin-bottom:18px;
}

.password-box input{
    width:100%;
    padding-right:45px;
}

.toggle{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
}

.strength{
    width:100%;
    height:8px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:8px;
}

#strengthBar{
    width:0;
    height:100%;
    transition:.3s;
}

#strengthText,
#matchText{
    font-size:14px;
    font-weight:600;
    margin-bottom:12px;
}

</style>

</head>

<body>

<div class="card">

<h2>Reset Password</h2>

<form method="POST">

    <div class="password-box">

        <input
            type="password"
            id="password"
            name="password"
            placeholder="New Password"
            required>

        <i class="fa-solid fa-eye toggle"
           onclick="togglePassword('password',this)">
        </i>

    </div>

    <!-- Password Strength -->
    <div class="strength">
        <div id="strengthBar"></div>
    </div>

    <p id="strengthText"></p>

    <div class="password-box">

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Confirm Password"
            required>

        <i class="fa-solid fa-eye toggle"
           onclick="togglePassword('confirm_password',this)">
        </i>

    </div>

    <p id="matchText"></p>

    <button type="submit">
        Update Password
    </button>

</form>

</div>

<script>

function togglePassword(id, icon){

    const input = document.getElementById(id);

    if(input.type === "password"){
        input.type = "text";
        icon.classList.replace("fa-eye","fa-eye-slash");
    }
    else{
        input.type = "password";
        icon.classList.replace("fa-eye-slash","fa-eye");
    }

}

const pass = document.getElementById("password");
const confirm = document.getElementById("confirm_password");
const match = document.getElementById("matchText");

const bar = document.getElementById("strengthBar");
const text = document.getElementById("strengthText");

function checkMatch(){

    if(confirm.value === ""){
        match.innerHTML = "";
        return;
    }

    if(pass.value === confirm.value){
        match.innerHTML = "✔ Passwords Match";
        match.style.color = "#22c55e";
    }
    else{
        match.innerHTML = "✖ Passwords Do Not Match";
        match.style.color = "#ef4444";
    }

}

pass.addEventListener("input", function(){

    let p = pass.value;
    let score = 0;

    if(p.length >= 8) score++;
    if(/[A-Z]/.test(p)) score++;
    if(/[0-9]/.test(p)) score++;
    if(/[^A-Za-z0-9]/.test(p)) score++;

    if(score == 1){
        bar.style.width = "25%";
        bar.style.background = "red";
        text.innerHTML = "Weak";
    }
    else if(score == 2){
        bar.style.width = "50%";
        bar.style.background = "orange";
        text.innerHTML = "Medium";
    }
    else if(score == 3){
        bar.style.width = "75%";
        bar.style.background = "#0ea5e9";
        text.innerHTML = "Good";
    }
    else if(score == 4){
        bar.style.width = "100%";
        bar.style.background = "#22c55e";
        text.innerHTML = "Strong";
    }
    else{
        bar.style.width = "0";
        text.innerHTML = "";
    }

    checkMatch();

});

confirm.addEventListener("input", checkMatch);

</script>

</body>
</html>
